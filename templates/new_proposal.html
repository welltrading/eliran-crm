
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יצירת הצעת מחיר חדשה</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        div { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>יצירת הצעת מחיר חדשה</h1>
    <form method="POST">
        <div>
            <label for="customer_name">שם לקוח:</label>
            <input type="text" id="customer_name" name="customer_name" required>
        </div>
        <div>
            <label for="customer_phone">טלפון לקוח:</label>
            <input type="text" id="customer_phone" name="customer_phone">
        </div>
        <div>
            <label for="product_name">שם מוצר:</label>
            <input type="text" id="product_name" name="product_name" required>
        </div>
        <div>
            <label for="quantity">כמות:</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1" required>
        </div>
        <div>
            <label for="price">מחיר יחידה:</label>
            <input type="number" id="price" name="price" step="0.01" required>
        </div>
        <div>
            <label for="payment_terms">תנאי תשלום:</label>
            <textarea id="payment_terms" name="payment_terms"></textarea>
        </div>
        <div>
            <label for="validity">תוקף הצעה (ימים):</label>
            <input type="number" id="validity" name="validity" value="30" min="1">
        </div>
        <button type="submit">שלח הצעה</button>
    </form>
    <p><a href="/">חזור לדף הבית</a></p>
</body>
</html>
