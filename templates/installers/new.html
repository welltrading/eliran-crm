{% extends 'base.html' %}
{% block title %}מתקין חדש{% endblock %}
{% block page_title %}<i class="bi bi-person-plus me-2"></i>הוסף מתקין חדש{% endblock %}

{% block topbar_actions %}
  <a href="{{ url_for('installers_list') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-right me-1"></i>ביטול
  </a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-person-plus me-2"></i>פרטי המתקין החדש
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('installer_new') }}">
          <div class="mb-3">
            <label class="form-label">שם פרטי</label>
            <input type="text" name="שם פרטי" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">טלפון</label>
            <input type="text" name="טלפון" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">סוג התקנה שיכול לבצע</label>
            <input type="text" name="סוג התקנה שיכול לבצע" class="form-control" placeholder="למשל: התאמה אישית, שגרתי (מופרד בפסיקים)">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>שמור מתקין
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
