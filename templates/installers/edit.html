{% extends 'base.html' %}
{% block title %}עריכת מתקין{% endblock %}
{% block page_title %}<i class="bi bi-pencil me-2"></i>עריכת מתקין{% endblock %}

{% block topbar_actions %}
  <a href="{{ url_for('installers_list') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-right me-1"></i>ביטול
  </a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-pencil-square me-2"></i>עדכון פרטי המתקין
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('installer_edit', record_id=installer.id) }}">
          <div class="mb-3">
            <label class="form-label">שם פרטי</label>
            <input type="text" name="שם פרטי" class="form-control" value="{{ installer.get('שם פרטי', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">טלפון</label>
            <input type="text" name="טלפון" class="form-control" value="{{ installer.get('טלפון', '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">סוג התקנה שיכול לבצע</label>
            <input type="text" name="סוג התקנה שיכול לבצע" class="form-control" value="{{ installer.get('סוג התקנה שיכול לבצע', []) | join(', ') }}" placeholder="למשל: התאמה אישית, שגרתי (מופרד בפסיקים)">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>עדכן מתקין
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
