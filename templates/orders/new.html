{% extends 'base.html' %}
{% block title %}הזמנה חדשה{% endblock %}
{% block page_title %}<i class="bi bi-cart-plus me-2"></i>הזמנה חדשה{% endblock %}

{% block topbar_actions %}
  <a href="{{ url_for('orders_list') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-right me-1"></i>חזרה
  </a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><i class="bi bi-cart-plus me-2"></i>יצירת הזמנה חדשה</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-600">לקוח</label>
            <select name="customer_id" class="form-select">
              <option value="">— בחר לקוח —</option>
              {% for c in customers %}
              <option value="{{ c.id }}">{{ c.get('שם', c.id) }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-600">תיאור / נושא</label>
            <input type="text" name="description" class="form-control" placeholder="תיאור קצר של ההזמנה">
          </div>
          <div class="mb-3">
            <label class="form-label fw-600">סטטוס</label>
            <select name="status" class="form-select">
              {% for s in ['טיוטה','ממתינה לאישור','אושרה','בייצור','מוכנה','הותקנה'] %}
              <option value="{{ s }}">{{ s }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-600">הערות</label>
            <textarea name="notes" class="form-control" rows="3" placeholder="הערות נוספות..."></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>יצירת הזמנה
            </button>
            <a href="{{ url_for('orders_list') }}" class="btn btn-outline-secondary">ביטול</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
