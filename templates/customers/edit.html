{% extends 'base.html' %}
{% block title %}עריכת {{ customer.get('שם', 'לקוח') }}{% endblock %}
{% block page_title %}<i class="bi bi-pencil me-2"></i>עריכת לקוח{% endblock %}

{% block topbar_actions %}
  <a href="{{ url_for('customer_detail', record_id=customer.id) }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-right me-1"></i>חזרה
  </a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header"><i class="bi bi-pencil me-2"></i>עריכת פרטי לקוח</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-600">שם מלא <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" value="{{ customer.get('שם', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-600">טלפון</label>
            <input type="tel" name="phone" class="form-control" value="{{ customer.get('טלפון', '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-600">אימייל</label>
            <input type="email" name="email" class="form-control" value="{{ customer.get('אימייל', '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-600">כתובת</label>
            <input type="text" name="address" class="form-control" value="{{ customer.get('כתובת', '') }}">
          </div>
          <div class="mb-4">
            <label class="form-label fw-600">הערות</label>
            <textarea name="notes" class="form-control" rows="3">{{ customer.get('הערות', '') }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>שמירת שינויים
            </button>
            <a href="{{ url_for('customer_detail', record_id=customer.id) }}" class="btn btn-outline-secondary">ביטול</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
